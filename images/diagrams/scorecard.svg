<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="scorecard-t scorecard-d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="scorecard-t">The autopsy scorecard</title><desc id="scorecard-d">Three ring gauges scoring entry quality, exit discipline, and risk management. A footer notes that the score measures the decision, not the outcome.</desc>
<defs>
  <marker id="scorecard-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,1.5 L8,5 L0,8.5 z" fill="#3d4144"/>
  </marker>
</defs>
<rect width="900" height="340" rx="10" fill="#0a0b0c"/>
<text x="28" y="32" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">THREE SEPARATE SKILLS, SCORED 0 TO 100</text><rect x="28" y="52" width="268" height="200" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><circle cx="162" cy="132" r="44" fill="none" stroke="#1e2022" stroke-width="10"/><circle cx="162" cy="132" r="44" fill="none" stroke="#459e6b" stroke-width="10" stroke-linecap="round" stroke-dasharray="204.6 276.5" transform="rotate(-90 162 132)"/><text x="162" y="139" fill="#459e6b" font-size="15" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="middle">good</text><text x="162" y="198" fill="#e8e9ea" font-size="13" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="middle">Entry quality</text><text x="162" y="218" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="middle">Was the setup there when you got in,</text><text x="162" y="233" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="middle">or did you chase it?</text><rect x="318" y="52" width="268" height="200" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><circle cx="452" cy="132" r="44" fill="none" stroke="#1e2022" stroke-width="10"/><circle cx="452" cy="132" r="44" fill="none" stroke="#9aa0a3" stroke-width="10" stroke-linecap="round" stroke-dasharray="105.1 276.5" transform="rotate(-90 452 132)"/><text x="452" y="139" fill="#9aa0a3" font-size="15" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="middle">low</text><text x="452" y="198" fill="#e8e9ea" font-size="13" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="middle">Exit discipline</text><text x="452" y="218" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="middle">Did you leave when your plan said</text><text x="452" y="233" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="middle">to, in both directions?</text><rect x="608" y="52" width="268" height="200" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><circle cx="742" cy="132" r="44" fill="none" stroke="#1e2022" stroke-width="10"/><circle cx="742" cy="132" r="44" fill="none" stroke="#6b7073" stroke-width="10" stroke-linecap="round" stroke-dasharray="160.3 276.5" transform="rotate(-90 742 132)"/><text x="742" y="139" fill="#6b7073" font-size="15" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="middle">fair</text><text x="742" y="198" fill="#e8e9ea" font-size="13" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="middle">Risk management</text><text x="742" y="218" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="middle">Was the position sized so a loss</text><text x="742" y="233" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="middle">stayed survivable?</text><rect x="28" y="268" width="844" height="46" rx="8" fill="#161719" stroke="rgba(69,158,107,0.30)" stroke-width="1" stroke-dasharray="4 3"/><text x="48" y="291" fill="#e8e9ea" font-size="11.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">A profitable trade can score badly, and a losing trade can score well.</text><text x="48" y="308" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The score is about the decision, not the outcome.</text>
</svg>
