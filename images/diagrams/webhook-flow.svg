<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="940" height="320" role="img" aria-labelledby="t d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="t">The outbound webhook flow</title><desc id="d">Five steps: a trigger fires, Tradion signs the payload with HMAC-SHA256, posts it to your HTTPS endpoint, you recompute and compare the signature in constant time, and only then act on it.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#63696c"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#459e6b"/>
  </marker>
</defs>
<rect width="940" height="320" rx="10" fill="#0b0c0d"/>
<text x="28" y="32" fill="#63696c" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">HOW AN OUTBOUND WEBHOOK REACHES YOU</text><rect x="28" y="60" width="168" height="104" rx="8" fill="#111315" stroke="#232729" stroke-width="1"/><rect x="42" y="74" width="22" height="20" rx="5" fill="rgba(69,158,107,0.14)" stroke="rgba(69,158,107,0.45)" stroke-width="1"/><text x="53" y="87.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">1</text><text x="42" y="116" fill="#f2f2f2" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Trigger fires</text><text x="42" y="134" fill="#63696c" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Your conditions are</text><text x="42" y="147" fill="#63696c" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">met</text><line x1="200" y1="112" x2="216" y2="112" stroke="#63696c" stroke-width="1.2" marker-end="url(#a)"/><rect x="220" y="60" width="168" height="104" rx="8" fill="#111315" stroke="#232729" stroke-width="1"/><rect x="234" y="74" width="22" height="20" rx="5" fill="rgba(69,158,107,0.14)" stroke="rgba(69,158,107,0.45)" stroke-width="1"/><text x="245" y="87.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">2</text><text x="234" y="116" fill="#f2f2f2" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Tradion signs it</text><text x="234" y="134" fill="#63696c" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">HMAC-SHA256 over the</text><text x="234" y="147" fill="#63696c" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">exact body</text><line x1="392" y1="112" x2="408" y2="112" stroke="#63696c" stroke-width="1.2" marker-end="url(#a)"/><rect x="412" y="60" width="168" height="104" rx="8" fill="#111315" stroke="#232729" stroke-width="1"/><rect x="426" y="74" width="22" height="20" rx="5" fill="rgba(69,158,107,0.14)" stroke="rgba(69,158,107,0.45)" stroke-width="1"/><text x="437" y="87.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">3</text><text x="426" y="116" fill="#f2f2f2" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">POST to your URL</text><text x="426" y="134" fill="#63696c" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">HTTPS only, public</text><text x="426" y="147" fill="#63696c" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">addresses only</text><line x1="584" y1="112" x2="600" y2="112" stroke="#63696c" stroke-width="1.2" marker-end="url(#a)"/><rect x="604" y="60" width="168" height="104" rx="8" fill="#111315" stroke="rgba(69,158,107,0.45)" stroke-width="1"/><rect x="618" y="74" width="22" height="20" rx="5" fill="rgba(69,158,107,0.14)" stroke="rgba(69,158,107,0.45)" stroke-width="1"/><text x="629" y="87.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">4</text><text x="618" y="116" fill="#459e6b" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">You verify</text><text x="618" y="134" fill="#63696c" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Recompute the hash,</text><text x="618" y="147" fill="#63696c" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">compare in constant time</text><line x1="776" y1="112" x2="792" y2="112" stroke="#63696c" stroke-width="1.2" marker-end="url(#a)"/><rect x="796" y="60" width="168" height="104" rx="8" fill="#111315" stroke="#232729" stroke-width="1"/><rect x="810" y="74" width="22" height="20" rx="5" fill="rgba(69,158,107,0.14)" stroke="rgba(69,158,107,0.45)" stroke-width="1"/><text x="821" y="87.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">5</text><text x="810" y="116" fill="#f2f2f2" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">You act</text><text x="810" y="134" fill="#63696c" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Only after the signature</text><text x="810" y="147" fill="#63696c" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">matches</text><rect x="28" y="186" width="884" height="62" rx="8" fill="#0b0c0d" stroke="#232729" stroke-width="1"/><text x="48" y="210" fill="#459e6b" font-size="11.5" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">X-Tradion-Signature: sha256=&lt;hex digest&gt;</text><text x="48" y="232" fill="#9aa0a3" font-size="11.5" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">Idempotency-Key: &lt;unique per delivery — use it to drop duplicates&gt;</text><rect x="28" y="262" width="884" height="40" rx="8" fill="#16191b" stroke="#d99a2b" stroke-width="1" stroke-dasharray="4 3"/><text x="48" y="287" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Treat an unsigned or mismatched request as hostile. Anyone can POST to a public URL.</text>
</svg>
