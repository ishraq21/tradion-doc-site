<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-labelledby="t d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="t">From a closed trade to a pre-flight check</title><desc id="d">Five stages in a loop: a closed trade becomes an autopsy, repeated findings become a pattern, the pattern becomes a playbook rule, and the rule becomes a pre-flight check before your next entry, which feeds back to the start.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#63696c"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#459e6b"/>
  </marker>
</defs>
<rect width="940" height="300" rx="10" fill="#0b0c0d"/>
<text x="28" y="32" fill="#63696c" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">HOW A SINGLE BAD TRADE TURNS INTO A HABIT THAT STOPS THE NEXT ONE</text><rect x="28" y="60" width="168" height="116" rx="8" fill="#111315" stroke="#232729" stroke-width="1"/><rect x="42" y="74" width="22" height="20" rx="5" fill="rgba(69,158,107,0.14)" stroke="rgba(69,158,107,0.45)" stroke-width="1"/><text x="53" y="87.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">1</text><text x="42" y="116" fill="#f2f2f2" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Closed trade</text><text x="42" y="136" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">You log it, or your</text><text x="42" y="150" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">broker does</text><line x1="200" y1="118" x2="216" y2="118" stroke="#459e6b" stroke-width="1.2" marker-end="url(#ag)"/><rect x="220" y="60" width="168" height="116" rx="8" fill="#111315" stroke="#232729" stroke-width="1"/><rect x="234" y="74" width="22" height="20" rx="5" fill="rgba(69,158,107,0.14)" stroke="rgba(69,158,107,0.45)" stroke-width="1"/><text x="245" y="87.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">2</text><text x="234" y="116" fill="#f2f2f2" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Autopsy</text><text x="234" y="136" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">What went wrong, and how</text><text x="234" y="150" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">much it mattered</text><line x1="392" y1="118" x2="408" y2="118" stroke="#459e6b" stroke-width="1.2" marker-end="url(#ag)"/><rect x="412" y="60" width="168" height="116" rx="8" fill="#111315" stroke="#232729" stroke-width="1"/><rect x="426" y="74" width="22" height="20" rx="5" fill="rgba(69,158,107,0.14)" stroke="rgba(69,158,107,0.45)" stroke-width="1"/><text x="437" y="87.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">3</text><text x="426" y="116" fill="#f2f2f2" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Pattern</text><text x="426" y="136" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The same finding, seen</text><text x="426" y="150" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">enough times to count</text><line x1="584" y1="118" x2="600" y2="118" stroke="#459e6b" stroke-width="1.2" marker-end="url(#ag)"/><rect x="604" y="60" width="168" height="116" rx="8" fill="#16191b" stroke="rgba(69,158,107,0.45)" stroke-width="1"/><rect x="618" y="74" width="22" height="20" rx="5" fill="rgba(69,158,107,0.14)" stroke="rgba(69,158,107,0.45)" stroke-width="1"/><text x="629" y="87.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">4</text><text x="618" y="116" fill="#f2f2f2" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Playbook rule</text><text x="618" y="136" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">You write the fix down</text><text x="618" y="150" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">as a rule</text><line x1="776" y1="118" x2="792" y2="118" stroke="#459e6b" stroke-width="1.2" marker-end="url(#ag)"/><rect x="796" y="60" width="168" height="116" rx="8" fill="#16191b" stroke="rgba(69,158,107,0.45)" stroke-width="1"/><rect x="810" y="74" width="22" height="20" rx="5" fill="rgba(69,158,107,0.14)" stroke="rgba(69,158,107,0.45)" stroke-width="1"/><text x="821" y="87.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">5</text><text x="810" y="116" fill="#f2f2f2" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Pre-flight check</text><text x="810" y="136" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">You read the rule before</text><text x="810" y="150" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">the next entry</text><path d="M880,180 L880,224 L112,224 L112,182" fill="none" stroke="#2f3437" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#a)"/><text x="470" y="244" fill="#63696c" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="middle">and the next trade feeds back in</text><text x="28" y="282" fill="#63696c" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Roughly ten closed trades is where the patterns stop being generic and start being yours.</text>
</svg>
