y free trial</text><rect x="318" y="152" width="268" height="148" rx="8" fill="#16191b" stroke="rgba(69,158,107,0.45)" stroke-width="1"/><text x="336" y="178" fill="#459e6b" font-size="15" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Trader</text><text x="336" y="196" fill="#63696c" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Adds automation</text><circle cx="340" cy="216" r="2.5" fill="#459e6b"/><text x="350" y="220" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Everything in Starter</text><circle cx="340" cy="236" r="2.5" fill="#459e6b"/><text x="350" y="240" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">AI Quant Research</text><circle cx="340" cy="256" r="2.5" fill="#459e6b"/><text x="350" y="260" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Automations &amp; alerts</text><circle cx="340" cy="276" r="2.5" fill="#459e6b"/><text x="350" y="280" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">AI agent nodes</text><rect x="318" y="306" width="268" height="34" rx="6" fill="#111315" stroke="#232729" stroke-width="1"/><text x="336" y="327" fill="#459e6b" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">7-day free trial</text><rect x="608" y="100" width="268" height="200" rx="8" fill="#111315" stroke="#232729" stroke-width="1"/><text x="626" y="126" fill="#f2f2f2" font-size="15" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Quant</text><text x="626" y="144" fill="#63696c" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Adds headroom</text><circle cx="630" cy="164" r="2.5" fill="#63696c"/><text x="640" y="168" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Everything in Trader</text><circle cx="630" cy="184" r="2.5" fill="#63696c"/><text x="640" y="188" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">10× the monthly limits</text><circle cx="630" cy="204" r="2.5" fill="#63696c"/><text x="640" y="208" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">More capable agent model</text><rect x="608" y="306" width="268" height="34" rx="6" fill="#111315" stroke="#232729" stroke-width="1"/><text x="626" y="327" fill="#d99a2b" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">No free trial</text><text x="28" y="364" fill="#63696c" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The dividing question: do you need Tradion watching the market while you are away?</text>
</svg>
