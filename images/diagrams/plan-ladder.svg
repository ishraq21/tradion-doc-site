<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="planladder-t planladder-d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="planladder-t">The three Tradion plans as a ladder</title><desc id="planladder-d">Three stacked columns of increasing height. Starter covers the analysis tools, Trader adds the quant terminal and automations, Quant adds ten times the monthly limits. Starter and Trader carry a seven-day trial; Quant does not.</desc>
<defs>
  <marker id="planladder-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,1.5 L8,5 L0,8.5 z" fill="#3d4144"/>
  </marker>
</defs>
<rect width="900" height="380" rx="10" fill="#0a0b0c"/>
<text x="28" y="34" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">EACH TIER ADDS TO THE ONE BEFORE IT</text><rect x="28" y="204" width="268" height="96" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="46" y="230" fill="#e8e9ea" font-size="15" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Starter</text><text x="46" y="248" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Analysis tools</text><circle cx="50" cy="268" r="2.5" fill="#6b7073"/><text x="60" y="272" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Chart Analyzer</text><circle cx="50" cy="288" r="2.5" fill="#6b7073"/><text x="60" y="292" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Lens</text><circle cx="50" cy="308" r="2.5" fill="#6b7073"/><text x="60" y="312" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Earnings Spider</text><circle cx="50" cy="328" r="2.5" fill="#6b7073"/><text x="60" y="332" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Trade Autopsy</text><circle cx="50" cy="348" r="2.5" fill="#6b7073"/><text x="60" y="352" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Portfolio + Asset Manager</text><rect x="28" y="306" width="268" height="34" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="46" y="327" fill="#459e6b" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">7-day free trial</text><rect x="318" y="152" width="268" height="148" rx="8" fill="#161719" stroke="rgba(69,158,107,0.30)" stroke-width="1"/><text x="336" y="178" fill="#459e6b" font-size="15" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Trader</text><text x="336" y="196" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Adds automation</text><circle cx="340" cy="216" r="2.5" fill="#459e6b"/><text x="350" y="220" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Everything in Starter</text><circle cx="340" cy="236" r="2.5" fill="#459e6b"/><text x="350" y="240" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">AI Quant Research</text><circle cx="340" cy="256" r="2.5" fill="#459e6b"/><text x="350" y="260" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Automations &amp; alerts</text><circle cx="340" cy="276" r="2.5" fill="#459e6b"/><text x="350" y="280" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">AI agent nodes</text><rect x="318" y="306" width="268" height="34" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="336" y="327" fill="#459e6b" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">7-day free trial</text><rect x="608" y="100" width="268" height="200" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="626" y="126" fill="#e8e9ea" font-size="15" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Quant</text><text x="626" y="144" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Adds headroom</text><circle cx="630" cy="164" r="2.5" fill="#6b7073"/><text x="640" y="168" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Everything in Trader</text><circle cx="630" cy="184" r="2.5" fill="#6b7073"/><text x="640" y="188" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">10× the monthly limits</text><circle cx="630" cy="204" r="2.5" fill="#6b7073"/><text x="640" y="208" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">More capable agent model</text><rect x="608" y="306" width="268" height="34" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="626" y="327" fill="#6b7073" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">No free trial</text><text x="28" y="364" fill="#6b7073" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The dividing question: do you need Tradion watching the market while you are away?</text>
</svg>
