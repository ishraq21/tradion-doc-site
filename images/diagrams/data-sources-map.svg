<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" role="img" aria-labelledby="datasourcesmap-t datasourcesmap-d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="datasourcesmap-t">Which provider supplies which data</title><desc id="datasourcesmap-d">Five data providers on the left (Alpaca, Alpha Vantage, FRED, SEC EDGAR, and your connected brokerage), each listing what it supplies, feeding a four-step pipeline on the right.</desc>
<defs>
  <marker id="datasourcesmap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,1.5 L8,5 L0,8.5 z" fill="#3d4144"/>
  </marker>
</defs>
<rect width="940" height="400" rx="10" fill="#0a0b0c"/>
<text x="28" y="32" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">WHERE EACH NUMBER COMES FROM</text><rect x="28" y="52" width="190" height="54" rx="7" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="46" y="76" fill="#e8e9ea" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Alpaca</text><text x="46" y="94" fill="#6b7073" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">market data provider</text><circle cx="252" cy="70" r="2.5" fill="#6b7073"/><text x="264" y="74" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Stock, crypto &amp; forex prices</text><circle cx="252" cy="87" r="2.5" fill="#6b7073"/><text x="264" y="91" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Options chains (OPRA feed)</text><circle cx="252" cy="104" r="2.5" fill="#6b7073"/><text x="264" y="108" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Real-time news</text><line x1="218" y1="79" x2="244" y2="79" stroke="#2a2d2f" stroke-width="1"/><rect x="28" y="118" width="190" height="54" rx="7" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="46" y="142" fill="#e8e9ea" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Alpha Vantage</text><text x="46" y="160" fill="#6b7073" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">market data provider</text><circle cx="252" cy="136" r="2.5" fill="#6b7073"/><text x="264" y="140" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Company fundamentals</text><circle cx="252" cy="153" r="2.5" fill="#6b7073"/><text x="264" y="157" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Earnings history &amp; estimates</text><line x1="218" y1="145" x2="244" y2="145" stroke="#2a2d2f" stroke-width="1"/><rect x="28" y="184" width="190" height="54" rx="7" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="46" y="208" fill="#e8e9ea" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">FRED</text><text x="46" y="226" fill="#6b7073" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">market data provider</text><circle cx="252" cy="202" r="2.5" fill="#6b7073"/><text x="264" y="206" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Interest rates &amp; inflation</text><circle cx="252" cy="219" r="2.5" fill="#6b7073"/><text x="264" y="223" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Other economic series</text><line x1="218" y1="211" x2="244" y2="211" stroke="#2a2d2f" stroke-width="1"/><rect x="28" y="250" width="190" height="54" rx="7" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="46" y="274" fill="#e8e9ea" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">SEC EDGAR</text><text x="46" y="292" fill="#6b7073" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">market data provider</text><circle cx="252" cy="268" r="2.5" fill="#6b7073"/><text x="264" y="272" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Company filings</text><circle cx="252" cy="285" r="2.5" fill="#6b7073"/><text x="264" y="289" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Insider transactions</text><line x1="218" y1="277" x2="244" y2="277" stroke="#2a2d2f" stroke-width="1"/><rect x="28" y="316" width="190" height="54" rx="7" fill="#101113" stroke="rgba(69,158,107,0.30)" stroke-width="1"/><text x="46" y="340" fill="#459e6b" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Your brokerage</text><text x="46" y="358" fill="#6b7073" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">via SnapTrade, read-only</text><circle cx="252" cy="334" r="2.5" fill="#6b7073"/><text x="264" y="338" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Positions &amp; balances</text><circle cx="252" cy="351" r="2.5" fill="#6b7073"/><text x="264" y="355" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Transaction history</text><line x1="218" y1="343" x2="244" y2="343" stroke="#2a2d2f" stroke-width="1"/><rect x="620" y="52" width="292" height="320" rx="8" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><text x="638" y="74" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">THEN TRADION</text><rect x="638" y="100" width="256" height="44" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="654" y="127" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Caches it briefly so screens stay fast</text><line x1="766" y1="144" x2="766" y2="162" stroke="#2a2d2f" stroke-width="1" marker-end="url(#datasourcesmap-arrow)"/><rect x="638" y="162" width="256" height="44" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="654" y="189" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Computes indicators from raw bars</text><line x1="766" y1="206" x2="766" y2="224" stroke="#2a2d2f" stroke-width="1" marker-end="url(#datasourcesmap-arrow)"/><rect x="638" y="224" width="256" height="44" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="654" y="251" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Feeds it to the AI with your profile</text><line x1="766" y1="268" x2="766" y2="286" stroke="#2a2d2f" stroke-width="1" marker-end="url(#datasourcesmap-arrow)"/><rect x="638" y="286" width="256" height="44" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="654" y="313" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Shows you the result</text>
</svg>
