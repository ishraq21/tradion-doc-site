<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300" role="img" aria-labelledby="automationflow-t automationflow-d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="automationflow-t">The five node types in an automation</title><desc id="automationflow-d">A left-to-right chain of five nodes: asset, signal, logic, agent, and action. Asset, signal, and action are required; logic and agent are optional.</desc>
<defs>
  <marker id="automationflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,1.5 L8,5 L0,8.5 z" fill="#3d4144"/>
  </marker>
</defs>
<rect width="940" height="300" rx="10" fill="#0a0b0c"/>
<text x="28" y="32" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">EVERY AUTOMATION IS THIS CHAIN, LEFT TO RIGHT</text><rect x="28" y="62" width="162" height="108" rx="8" fill="#101113" stroke="rgba(69,158,107,0.30)" stroke-width="1"/><text x="44" y="92" fill="#459e6b" font-size="13.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Asset</text><text x="44" y="114" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">What to</text><text x="44" y="129" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">watch</text><rect x="44" y="142" width="62" height="18" rx="5" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="75" y="154.5" fill="#9aa0a3" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">required</text><line x1="194" y1="116" x2="212" y2="116" stroke="#3d4144" stroke-width="1.2" marker-end="url(#automationflow-arrow)"/><rect x="216" y="62" width="162" height="108" rx="8" fill="#101113" stroke="rgba(69,158,107,0.30)" stroke-width="1"/><text x="232" y="92" fill="#459e6b" font-size="13.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Signal</text><text x="232" y="114" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The condition, 1 to</text><text x="232" y="129" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">10 of them</text><rect x="232" y="142" width="62" height="18" rx="5" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="263" y="154.5" fill="#9aa0a3" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">required</text><line x1="382" y1="116" x2="400" y2="116" stroke="#3d4144" stroke-width="1.2" marker-end="url(#automationflow-arrow)"/><rect x="404" y="62" width="162" height="108" rx="8" fill="#161719" stroke="#2a2d2f" stroke-width="1" stroke-dasharray="4 3"/><text x="420" y="92" fill="#9aa0a3" font-size="13.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Logic</text><text x="420" y="114" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">AND / OR, appears at</text><text x="420" y="129" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">2+</text><rect x="420" y="142" width="62" height="18" rx="5" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="451" y="154.5" fill="#9aa0a3" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">optional</text><line x1="570" y1="116" x2="588" y2="116" stroke="#3d4144" stroke-width="1.2" marker-end="url(#automationflow-arrow)"/><rect x="592" y="62" width="162" height="108" rx="8" fill="#161719" stroke="#2a2d2f" stroke-width="1" stroke-dasharray="4 3"/><text x="608" y="92" fill="#9aa0a3" font-size="13.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Agent</text><text x="608" y="114" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Optional AI research</text><text x="608" y="129" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">step</text><rect x="608" y="142" width="62" height="18" rx="5" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="639" y="154.5" fill="#9aa0a3" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">optional</text><line x1="758" y1="116" x2="776" y2="116" stroke="#3d4144" stroke-width="1.2" marker-end="url(#automationflow-arrow)"/><rect x="780" y="62" width="162" height="108" rx="8" fill="#101113" stroke="rgba(69,158,107,0.30)" stroke-width="1"/><text x="796" y="92" fill="#459e6b" font-size="13.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Action</text><text x="796" y="114" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Where the alert</text><text x="796" y="129" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">goes</text><rect x="796" y="142" width="62" height="18" rx="5" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="827" y="154.5" fill="#9aa0a3" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">required</text><rect x="28" y="194" width="884" height="76" rx="8" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><text x="48" y="220" fill="#e8e9ea" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">An automation watches and tells you. It never places an order.</text><text x="48" y="240" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Condition checks cost you nothing. Only the optional Agent step draws on your monthly allowance.</text><text x="48" y="258" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Automations run around the clock, not only during market hours.</text>
</svg>
