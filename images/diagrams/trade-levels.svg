<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="t">Entry, stop, and target on a price axis</title><desc id="d">A price line with three horizontal levels marked: target above, entry in the middle, stop below. The distance above entry is labelled reward, the distance below is labelled risk, and their ratio is shown as three to one.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#63696c"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#459e6b"/>
  </marker>
</defs>
<rect width="900" height="380" rx="10" fill="#0b0c0d"/>
<text x="28" y="34" fill="#63696c" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">THREE LEVELS, AND THE RATIO THAT FOLLOWS FROM THEM</text><rect x="28" y="52" width="560" height="280" rx="8" fill="#111315" stroke="#232729" stroke-width="1"/><path d="M56.0,232.0 L111.6,208.0 L167.1,220.0 L222.7,192.0 L278.2,204.0 L333.8,176.0 L389.3,188.0 L444.9,160.0 L500.4,172.0 L556.0,148.0" fill="none" stroke="#2f3437" stroke-width="1.6" stroke-linecap="round"/><line x1="56" y1="80" x2="556" y2="80" stroke="#459e6b" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="56" y="69" width="62" height="22" rx="5" fill="#0b0c0d" stroke="#459e6b" stroke-width="1"/><text x="87" y="84" fill="#459e6b" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">Target</text><text x="132" y="84" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">where you take profit</text><line x1="56" y1="200" x2="556" y2="200" stroke="#9aa0a3" stroke-width="1.2"/><rect x="56" y="189" width="62" height="22" rx="5" fill="#0b0c0d" stroke="#9aa0a3" stroke-width="1"/><text x="87" y="204" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">Entry</text><text x="132" y="204" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">where you get in</text><line x1="56" y1="300" x2="556" y2="300" stroke="#c9524f" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="56" y="289" width="62" height="22" rx="5" fill="#0b0c0d" stroke="#c9524f" stroke-width="1"/><text x="87" y="304" fill="#c9524f" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">Stop</text><text x="132" y="304" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">where you accept you were wrong</text><path d="M600,80 L600,200" fill="none" stroke="#459e6b" stroke-width="1.4"/><path d="M600,200 L600,300" fill="none" stroke="#c9524f" stroke-width="1.4"/><line x1="592" y1="80" x2="608" y2="80" stroke="#459e6b" stroke-width="1"/><line x1="592" y1="200" x2="608" y2="200" stroke="#63696c" stroke-width="1"/><line x1="592" y1="300" x2="608" y2="300" stroke="#c9524f" stroke-width="1"/><text x="618" y="144" fill="#459e6b" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">reward</text><text x="618" y="254" fill="#c9524f" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">risk</text><rect x="700" y="130" width="172" height="120" rx="8" fill="#16191b" stroke="rgba(69,158,107,0.45)" stroke-width="1"/><text x="716" y="152" fill="#63696c" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">RISK / REWARD</text><text x="786" y="196" fill="#459e6b" font-size="26" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" text-anchor="middle">3 : 1</text><text x="786" y="222" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="middle">reward ÷ risk</text><text x="28" y="358" fill="#63696c" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Tradion derives the ratio from the levels. It does not decide whether the ratio is good enough for you.</text>
</svg>
