<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" role="img" aria-labelledby="tradelevels-t tradelevels-d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="tradelevels-t">Entry, stop and target, and what the ratio between them demands</title><desc id="tradelevels-d">On the left, a price axis with target above, entry in the middle and stop below. A dashed band one ATR either side of entry marks ordinary movement, noting that a stop placed inside it is taken out by noise rather than by being wrong. The spans above and below entry are labelled reward and risk. On the right, four ratios with the break-even win rate each needs: three to one needs twenty-five per cent, two to one needs thirty-three, one and a half to one needs forty, one to one needs fifty. A line marks where Tradion prints the ratio in red, with a note that the analysis itself is graded against two to one for swing, one and a half for day trades and one to one for scalps.</desc>
<defs>
  <marker id="tradelevels-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,1.5 L8,5 L0,8.5 z" fill="#3d4144"/>
  </marker>
</defs>
<rect width="900" height="372" rx="10" fill="#0a0b0c"/>
<text x="40" y="40" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">THE THREE PRICES</text><rect x="150" y="154" width="250" height="72" rx="6" fill="#161719" stroke="#2a2d2f" stroke-width="1" stroke-dasharray="4 4"/><text x="162" y="172" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">ONE ATR · ORDINARY MOVEMENT</text><line x1="150" y1="76" x2="400" y2="76" stroke="#2a2d2f" stroke-width="1.2"/><text x="138" y="80" fill="#e8e9ea" font-size="11.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="end">Target</text><line x1="150" y1="190" x2="400" y2="190" stroke="#2a2d2f" stroke-width="1.2"/><text x="138" y="194" fill="#e8e9ea" font-size="11.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="end">Entry</text><line x1="150" y1="252" x2="400" y2="252" stroke="#2a2d2f" stroke-width="1.2"/><text x="138" y="256" fill="#e8e9ea" font-size="11.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="end">Stop</text><text x="162" y="206" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">a stop in here is taken out by</text><text x="162" y="219" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">ordinary movement, not by being wrong</text><path d="M416,76 L416,190" fill="none" stroke="#3d4144" stroke-width="1.2"/><line x1="411" y1="76" x2="421" y2="76" stroke="#3d4144" stroke-width="1"/><line x1="411" y1="190" x2="421" y2="190" stroke="#3d4144" stroke-width="1"/><text x="428" y="137" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">reward</text><path d="M416,190 L416,252" fill="none" stroke="#3d4144" stroke-width="1.2"/><line x1="411" y1="190" x2="421" y2="190" stroke="#3d4144" stroke-width="1"/><line x1="411" y1="252" x2="421" y2="252" stroke="#3d4144" stroke-width="1"/><text x="428" y="225" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">risk</text><text x="500" y="40" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">WHAT EACH RATIO ASKS OF YOU</text><text x="500" y="62" fill="#6b7073" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The win rate you need to break even, before costs</text><text x="500" y="96" fill="#e8e9ea" font-size="12" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">3 : 1</text><rect x="584" y="89" width="200" height="8" rx="4" fill="#1e2022"/><rect x="584" y="89" width="50.0" height="8" rx="4" fill="#3d4144"/><text x="798" y="96" fill="#9aa0a3" font-size="12" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">25%</text><text x="500" y="132" fill="#e8e9ea" font-size="12" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">2 : 1</text><rect x="584" y="125" width="200" height="8" rx="4" fill="#1e2022"/><rect x="584" y="125" width="66.0" height="8" rx="4" fill="#3d4144"/><text x="798" y="132" fill="#9aa0a3" font-size="12" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">33%</text><text x="500" y="168" fill="#e8e9ea" font-size="12" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">1.5 : 1</text><rect x="584" y="161" width="200" height="8" rx="4" fill="#1e2022"/><rect x="584" y="161" width="80.0" height="8" rx="4" fill="#3d4144"/><text x="798" y="168" fill="#9aa0a3" font-size="12" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">40%</text><line x1="500" y1="192" x2="820" y2="192" stroke="rgba(69,158,107,0.30)" stroke-width="1" stroke-dasharray="4 4"/><text x="500" y="208" fill="#459e6b" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Tradion prints the ratio in red below this line</text><text x="500" y="232" fill="#e8e9ea" font-size="12" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">1 : 1</text><rect x="584" y="225" width="200" height="8" rx="4" fill="#1e2022"/><rect x="584" y="225" width="100.0" height="8" rx="4" fill="#3d4144"/><text x="798" y="232" fill="#9aa0a3" font-size="12" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">50%</text><text x="500" y="268" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The analysis is graded harder than the card is coloured:</text><text x="500" y="283" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">2:1 swing, 1.5:1 day trade, 1:1 scalp.</text><line x1="40" y1="320" x2="860" y2="320" stroke="#1e2022" stroke-width="1"/><text x="44" y="344" fill="#9aa0a3" font-size="11.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The ratio is arithmetic on the three prices, never a judgement. Widen the stop and it falls with you.</text>
</svg>
