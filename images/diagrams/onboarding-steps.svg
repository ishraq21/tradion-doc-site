<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" role="img" aria-labelledby="onboardingsteps-t onboardingsteps-d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="onboardingsteps-t">The five onboarding steps</title><desc id="onboardingsteps-d">Five numbered steps in a row: your name, how you trade, what to improve, what is costing you money, and choose a plan. Steps three and four are highlighted because they seed your trader profile.</desc>
<defs>
  <marker id="onboardingsteps-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,1.5 L8,5 L0,8.5 z" fill="#3d4144"/>
  </marker>
</defs>
<rect width="940" height="300" rx="10" fill="#0a0b0c"/>
<text x="28" y="34" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">ONBOARDING, ABOUT 30 SECONDS</text><rect x="28" y="56" width="168" height="130" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><circle cx="50" cy="82" r="9" fill="#0a0b0c" stroke="#459e6b" stroke-width="1"/><text x="50" y="85.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">1</text><text x="44" y="118" fill="#e8e9ea" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Your name</text><text x="44" y="138" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">What we call you</text><text x="44" y="153" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">throughout the app</text><line x1="198" y1="121" x2="208" y2="121" stroke="#3d4144" stroke-width="1.2" marker-end="url(#onboardingsteps-arrow)"/><rect x="211" y="56" width="168" height="130" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><circle cx="233" cy="82" r="9" fill="#0a0b0c" stroke="#459e6b" stroke-width="1"/><text x="233" y="85.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">2</text><text x="227" y="118" fill="#e8e9ea" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">How you trade</text><text x="227" y="138" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Experience, style, and instruments</text><line x1="381" y1="121" x2="391" y2="121" stroke="#3d4144" stroke-width="1.2" marker-end="url(#onboardingsteps-arrow)"/><rect x="394" y="56" width="168" height="130" rx="8" fill="#101113" stroke="rgba(69,158,107,0.30)" stroke-width="1"/><circle cx="416" cy="82" r="9" fill="#0a0b0c" stroke="#459e6b" stroke-width="1"/><text x="416" y="85.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">3</text><text x="410" y="118" fill="#e8e9ea" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">What to improve</text><text x="410" y="138" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Becomes tracked goals</text><text x="410" y="174" fill="#459e6b" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">feeds your profile</text><line x1="564" y1="121" x2="574" y2="121" stroke="#3d4144" stroke-width="1.2" marker-end="url(#onboardingsteps-arrow)"/><rect x="577" y="56" width="168" height="130" rx="8" fill="#101113" stroke="rgba(69,158,107,0.30)" stroke-width="1"/><circle cx="599" cy="82" r="9" fill="#0a0b0c" stroke="#459e6b" stroke-width="1"/><text x="599" y="85.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">4</text><text x="593" y="118" fill="#e8e9ea" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">What's costing you</text><text x="593" y="138" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Seeds the pattern detector</text><text x="593" y="174" fill="#459e6b" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">feeds your profile</text><line x1="747" y1="121" x2="757" y2="121" stroke="#3d4144" stroke-width="1.2" marker-end="url(#onboardingsteps-arrow)"/><rect x="760" y="56" width="168" height="130" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><circle cx="782" cy="82" r="9" fill="#0a0b0c" stroke="#459e6b" stroke-width="1"/><text x="782" y="85.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">5</text><text x="776" y="118" fill="#e8e9ea" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Choose a plan</text><text x="776" y="138" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Starts your subscription</text><rect x="28" y="210" width="884" height="62" rx="8" fill="#161719" stroke="rgba(69,158,107,0.30)" stroke-width="1" stroke-dasharray="4 3"/><text x="48" y="236" fill="#e8e9ea" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Steps 3 and 4 are the ones that matter most.</text><text x="48" y="256" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">They give Tradion something to work with before you have any trade history.</text>
</svg>
