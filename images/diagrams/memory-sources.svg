<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" role="img" aria-labelledby="memorysources-t memorysources-d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="memorysources-t">How Tradion Memory works</title><desc id="memorysources-d">Seven activity sources on the left feed into a single trader profile in the centre, which then shapes three kinds of AI output on the right.</desc>
<defs>
  <marker id="memorysources-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,1.5 L8,5 L0,8.5 z" fill="#3d4144"/>
  </marker>
</defs>
<rect width="940" height="460" rx="10" fill="#0a0b0c"/>
<text x="28" y="32" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">WHAT YOU DO</text><text x="400" y="32" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">WHAT IT BUILDS</text><text x="720" y="32" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">WHAT IT CHANGES</text><rect x="28" y="72" width="200" height="28" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="42" y="90" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Chat sessions</text><path d="M232,86 C280,86 330,225 386,225" fill="none" stroke="#2a2d2f" stroke-width="1"/><rect x="28" y="118" width="200" height="28" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="42" y="136" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Tradion Lens analyses</text><path d="M232,132 C280,132 330,225 386,225" fill="none" stroke="#2a2d2f" stroke-width="1"/><rect x="28" y="164" width="200" height="28" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="42" y="182" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Trade autopsies</text><path d="M232,178 C280,178 330,225 386,225" fill="none" stroke="#2a2d2f" stroke-width="1"/><rect x="28" y="210" width="200" height="28" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="42" y="228" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Earnings reports</text><path d="M232,224 C280,224 330,225 386,225" fill="none" stroke="#2a2d2f" stroke-width="1"/><rect x="28" y="256" width="200" height="28" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="42" y="274" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Trading patterns</text><path d="M232,270 C280,270 330,225 386,225" fill="none" stroke="#2a2d2f" stroke-width="1"/><rect x="28" y="302" width="200" height="28" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="42" y="320" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Portfolio positions</text><path d="M232,316 C280,316 330,225 386,225" fill="none" stroke="#2a2d2f" stroke-width="1"/><rect x="28" y="348" width="200" height="28" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="42" y="366" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Trade journal</text><path d="M232,362 C280,362 330,225 386,225" fill="none" stroke="#2a2d2f" stroke-width="1"/><rect x="390" y="150" width="250" height="150" rx="8" fill="#161719" stroke="rgba(69,158,107,0.30)" stroke-width="1"/><text x="415" y="180" fill="#459e6b" font-size="13.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Your trader profile</text><circle cx="419" cy="200" r="2.5" fill="#459e6b"/><text x="429" y="204" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">How you size and time trades</text><circle cx="419" cy="222" r="2.5" fill="#459e6b"/><text x="429" y="226" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Which mistakes repeat, and how often</text><circle cx="419" cy="244" r="2.5" fill="#459e6b"/><text x="429" y="248" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">What you say you want to fix</text><circle cx="419" cy="266" r="2.5" fill="#459e6b"/><text x="429" y="270" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Your archetype and biases</text><line x1="644" y1="225" x2="706" y2="225" stroke="#459e6b" stroke-width="1.2" marker-end="url(#memorysources-arrow)"/><rect x="712" y="170" width="200" height="30" rx="6" fill="#101113" stroke="#3d4144" stroke-width="1"/><text x="726" y="189" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Tradion Lens reads</text><rect x="712" y="220" width="200" height="30" rx="6" fill="#101113" stroke="#3d4144" stroke-width="1"/><text x="726" y="239" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Portfolio Analyst replies</text><rect x="712" y="270" width="200" height="30" rx="6" fill="#101113" stroke="#3d4144" stroke-width="1"/><text x="726" y="289" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Autopsy coaching</text><rect x="28" y="424" width="884" height="24" rx="6" fill="none" stroke="none" stroke-width="0"/><text x="28" y="440" fill="#6b7073" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Memory runs passively. There is no switch to turn it on.</text>
