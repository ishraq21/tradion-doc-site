'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Playbook rules</text><path d="M232,397 C280,397 330,225 386,225" fill="none" stroke="#2a2d2f" stroke-width="1"/><rect x="390" y="150" width="250" height="150" rx="8" fill="#161719" stroke="rgba(69,158,107,0.30)" stroke-width="1"/><text x="415" y="180" fill="#459e6b" font-size="13.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Your trader profile</text><circle cx="419" cy="200" r="2.5" fill="#459e6b"/><text x="429" y="204" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">How you size and time trades</text><circle cx="419" cy="222" r="2.5" fill="#459e6b"/><text x="429" y="226" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Which mistakes repeat, and how often</text><circle cx="419" cy="244" r="2.5" fill="#459e6b"/><text x="429" y="248" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">What you say you want to fix</text><circle cx="419" cy="266" r="2.5" fill="#459e6b"/><text x="429" y="270" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Your archetype and biases</text><line x1="644" y1="225" x2="706" y2="225" stroke="#459e6b" stroke-width="1.2" marker-end="url(#memorysources-arrow)"/><rect x="712" y="128" width="200" height="30" rx="6" fill="#101113" stroke="#3d4144" stroke-width="1"/><text x="726" y="147" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Chart &amp; Lens verdicts</text><rect x="712" y="168" width="200" height="30" rx="6" fill="#101113" stroke="#3d4144" stroke-width="1"/><text x="726" y="187" fill="#9aa0a3" font-size