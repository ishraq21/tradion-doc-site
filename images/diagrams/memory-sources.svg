e-width="1"/><rect x="28" y="234" width="200" height="28" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="42" y="252" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Earnings reports</text><path d="M232,248 C280,248 330,225 386,225" fill="none" stroke="#2a2d2f" stroke-width="1"/><rect x="28" y="280" width="200" height="28" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="42" y="298" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Trading patterns</text><path d="M232,294 C280,294 330,225 386,225" fill="none" stroke="#2a2d2f" stroke-width="1"/><rect x="28" y="326" width="200" height="28" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="42" y="344" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Portfolio positions</text><path d="M232,340 C280,340 330,225 386,225" fill="none" stroke="#2a2d2f" stroke-width="1"/><rect x="28" y="372" width="200" height="28" rx="6" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="42" y="390" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Trade journal</text><path d="M232,386 C280,386 330,225 386,225" fill="none" stroke="#2a2d2f" stroke-width="1"/><rect x="390" y="150" width="250" height="150" rx="8" fill="#161719" stroke="rgba(69,158,107,0.30)" stroke-width="1"/><text x="415" y="180" fill="#459e6b" font-size="13.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Your trader profile</text><circle cx="419" cy="200" r="2.5" fill="#459e6b"/><text x="429" y="204" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">How you size and time trades</text><circle cx="419" cy="222" r="2.5" fill="#459e6b"/><text x="429" y="226" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Which mistakes repeat, and how often</text><circle cx="419" cy="244" r="2.5" fill="#459e6b"/><text x="429" y="248" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">What you say you want to fix</text><circle cx="419" cy="266" r="2.5" fill="#459e6b"/><text x="429" y="270" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Your archetype and biases</text><line x1="644" y1="225" x2="706" y2="225" stroke="#459e6b" stroke-width="1.2" marker-end="url(#memorysources-arrow)"/><rect x="712" y="170" width="200" height="30" rx="6" fill="#101113" stroke="#3d4144" stroke-width="1"/><text x="726" y="189" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Chart &amp; Lens verdicts</text><rect x="712" y="220" width="200" height="30" rx="6" fill="#101113" stroke="#3d4144" stroke-width="1"/><text x="726" y="239" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Portfolio Analyst replies</text><rect x="712" y="270" width="200" height="30" rx="6" fill="#101113" stroke="#3d4144" stroke-width="1"/><text x="726" y="289" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Autopsy coaching</text><rect x="28" y="424" width="884" height="24" rx="6" fill="none" stroke="none" stroke-width="0"/><text x="28" y="440" fill="#6b7073" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Memory runs passively. There is no switch to turn it on.</text>
