<svg xmlns="http://www.w3.org/2000/svg" width="900" height="444" viewBox="0 0 900 444" role="img" aria-labelledby="verdictdecision-t verdictdecision-d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="verdictdecision-t">How Tradion arrives at one of four chart verdicts</title><desc id="verdictdecision-d">Three checks in sequence. No directional edge gives NO TRADE, which comes back with no entry, stop, target or game plan. An edge that price has not reached yet gives WAIT, shown on the card as HOLD, which keeps all of its levels. An edge price has reached gives BUY or SELL. Confidence appears on all four and scores agreement in the evidence, not the odds of a payout.</desc>
<defs>
  <marker id="verdictdecision-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,1.5 L8,5 L0,8.5 z" fill="#3d4144"/>
  </marker>
</defs>
<rect width="900" height="444" rx="10" fill="#0a0b0c"/>
<text x="44" y="40" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">WHAT TRADION CHECKS</text><text x="468" y="40" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">WHAT THE CARD GIVES YOU</text><rect x="40" y="56" width="336" height="62" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="58" y="83" fill="#e8e9ea" font-size="12.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Is there a directional edge</text><text x="58" y="101" fill="#e8e9ea" font-size="12.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">on this chart at all?</text><rect x="40" y="178" width="336" height="62" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="58" y="205" fill="#e8e9ea" font-size="12.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Has price reached the</text><text x="58" y="223" fill="#e8e9ea" font-size="12.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">entry level yet?</text><rect x="40" y="300" width="336" height="62" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="58" y="327" fill="#e8e9ea" font-size="12.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Which way does the</text><text x="58" y="345" fill="#e8e9ea" font-size="12.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">setup lean?</text><line x1="208" y1="118" x2="208" y2="178" stroke="#459e6b" stroke-width="1.2"/><text x="218" y="152" fill="#459e6b" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">yes</text><line x1="208" y1="240" x2="208" y2="300" stroke="#459e6b" stroke-width="1.2"/><text x="218" y="274" fill="#459e6b" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">yes</text><line x1="376" y1="87" x2="458" y2="87" stroke="#3d4144" stroke-width="1.2" marker-end="url(#verdictdecision-arrow)"/><text x="414" y="79" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="middle">no</text><line x1="376" y1="209" x2="458" y2="209" stroke="#3d4144" stroke-width="1.2" marker-end="url(#verdictdecision-arrow)"/><text x="414" y="201" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="middle">no</text><rect x="464" y="52" width="396" height="70" rx="8" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><text x="482" y="77" fill="#e8e9ea" font-size="13.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" text-anchor="start">NO TRADE</text><text x="482" y="98" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">No entry, no stop, no target, no game plan.</text><text x="482" y="114" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Tradion strips them, so nothing reads as actionable.</text><rect x="464" y="174" width="396" height="70" rx="8" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><text x="482" y="199" fill="#e8e9ea" font-size="13.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" text-anchor="start">WAIT</text><text x="572" y="199" fill="#6b7073" font-size="10" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">the card prints HOLD</text><text x="482" y="220" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">A real setup, levels and all, that has not triggered.</text><text x="482" y="236" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">These are the prices worth setting an alert on.</text><line x1="376" y1="331" x2="444" y2="331" stroke="#3d4144" stroke-width="1.2" marker-end="url(#verdictdecision-arrow)"/><line x1="444" y1="312" x2="444" y2="350" stroke="#3d4144" stroke-width="1.2"/><line x1="444" y1="312" x2="458" y2="312" stroke="#3d4144" stroke-width="1.2" marker-end="url(#verdictdecision-arrow)"/><line x1="444" y1="350" x2="458" y2="350" stroke="#3d4144" stroke-width="1.2" marker-end="url(#verdictdecision-arrow)"/><rect x="464" y="296" width="396" height="32" rx="8" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><text x="482" y="317" fill="#e8e9ea" font-size="13.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" text-anchor="start">BUY</text><text x="572" y="317" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Bullish, and price is already at the entry.</text><rect x="464" y="334" width="396" height="32" rx="8" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><text x="482" y="355" fill="#e8e9ea" font-size="13.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" text-anchor="start">SELL</text><text x="572" y="355" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Bearish, and price is already at the entry.</text><line x1="40" y1="396" x2="860" y2="396" stroke="#1e2022" stroke-width="1"/><text x="44" y="420" fill="#9aa0a3" font-size="11.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Confidence rides on all four. It scores how much the evidence agreed, never the odds of a payout.</text>
</svg>
