<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="cellanatomy-t cellanatomy-d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="cellanatomy-t">Anatomy of a canvas cell</title><desc id="cellanatomy-d">One cell showing four parts: the question it answers, the generated Python code, the chart it produced, and a plain-English summary underneath.</desc>
<defs>
  <marker id="cellanatomy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,1.5 L8,5 L0,8.5 z" fill="#3d4144"/>
  </marker>
</defs>
<rect width="900" height="400" rx="10" fill="#0a0b0c"/>
<text x="28" y="32" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">WHAT ONE CANVAS CELL CONTAINS</text><rect x="28" y="48" width="560" height="320" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><rect x="48" y="66" width="54" height="20" rx="5" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="75" y="79.5" fill="#9aa0a3" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">Cell 1</text><rect x="110" y="66" width="48" height="20" rx="5" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="134" y="79.5" fill="#9aa0a3" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">Code</text><rect x="166" y="66" width="56" height="20" rx="5" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="194" y="79.5" fill="#9aa0a3" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">Output</text><rect x="530" y="66" width="44" height="20" rx="5" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="552" y="79.5" fill="#9aa0a3" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="middle">Copy</text><rect x="48" y="100" width="520" height="96" rx="6" fill="#0a0b0c" stroke="#2a2d2f" stroke-width="1"/><text x="62" y="120" fill="#9aa0a3" font-size="10.5" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">bars = fetch_bars("NVDA", timeframe="1Day", limit=252)</text><text x="62" y="138" fill="#9aa0a3" font-size="10.5" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">bars["dow"] = bars.index.day_name()</text><text x="62" y="156" fill="#9aa0a3" font-size="10.5" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">by_day = bars.groupby("dow")["return"].mean()</text><text x="62" y="178" fill="#6b7073" font-size="10.5" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">plot_bar(by_day, title="Average return by weekday")</text><rect x="48" y="208" width="520" height="108" rx="6" fill="#0a0b0c" stroke="#2a2d2f" stroke-width="1"/><rect x="78" y="260.4" width="56" height="39.6" rx="3" fill="#459e6b" stroke="none" stroke-width="0"/><rect x="178" y="242.4" width="56" height="57.6" rx="3" fill="#459e6b" stroke="none" stroke-width="0"/><rect x="278" y="271.2" width="56" height="28.8" rx="3" fill="#459e6b" stroke="none" stroke-width="0"/><rect x="378" y="248.16" width="56" height="51.839999999999996" rx="3" fill="#459e6b" stroke="none" stroke-width="0"/><rect x="478" y="279.84" width="56" height="20.160000000000004" rx="3" fill="#9aa0a3" stroke="none" stroke-width="0"/><rect x="48" y="328" width="520" height="26" rx="6" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><rect x="62" y="338" width="400" height="6" rx="3" fill="#1e2022"/><circle cx="618" cy="84" r="9" fill="#0a0b0c" stroke="#459e6b" stroke-width="1"/><text x="618" y="87.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">1</text><text x="640" y="88" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The question this cell answers</text><circle cx="618" cy="160" r="9" fill="#0a0b0c" stroke="#459e6b" stroke-width="1"/><text x="618" y="163.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">2</text><text x="640" y="164" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The Python Tradion wrote and ran</text><circle cx="618" cy="236" r="9" fill="#0a0b0c" stroke="#459e6b" stroke-width="1"/><text x="618" y="239.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">3</text><text x="640" y="240" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The chart or table it produced</text><circle cx="618" cy="312" r="9" fill="#0a0b0c" stroke="#459e6b" stroke-width="1"/><text x="618" y="315.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">4</text><text x="640" y="316" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">A plain-English summary of what it means</text><line x1="600" y1="84" x2="612" y2="84" stroke="#2a2d2f" stroke-width="1" stroke-dasharray="2 3"/><line x1="600" y1="148" x2="612" y2="160" stroke="#2a2d2f" stroke-width="1" stroke-dasharray="2 3"/><line x1="600" y1="262" x2="612" y2="236" stroke="#2a2d2f" stroke-width="1" stroke-dasharray="2 3"/><line x1="600" y1="341" x2="612" y2="312" stroke="#2a2d2f" stroke-width="1" stroke-dasharray="2 3"/><text x="28" y="388" fill="#6b7073" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The code is shown so you can read and learn it. You never have to write it.</text>
</svg>
