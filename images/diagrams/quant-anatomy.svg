<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" role="img" aria-labelledby="quantanatomy-t quantanatomy-d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="quantanatomy-t">Anatomy of the quant research terminal</title><desc id="quantanatomy-d">A split screen. On the left, a conversation where you ask a question in ordinary language and get a written answer. On the right, a canvas of cells, each showing generated code beside the chart it produced.</desc>
