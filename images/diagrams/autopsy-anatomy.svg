<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-labelledby="autopsyanatomy-t autopsyanatomy-d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="autopsyanatomy-t">Anatomy of an autopsy report</title><desc id="autopsyanatomy-d">An autopsy report broken into seven numbered sections: verdict, data coverage, timeline, attribution, scorecard, counterfactual, and lesson, each with a note explaining what to take from it.</desc>
<defs>
  <marker id="autopsyanatomy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,1.5 L8,5 L0,8.5 z" fill="#3d4144"/>
  </marker>
</defs>
<rect width="940" height="520" rx="10" fill="#0a0b0c"/>
<text x="28" y="32" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">AN AUTOPSY REPORT, TOP TO BOTTOM</text><rect x="28" y="48" width="560" height="452" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><rect x="46" y="70" width="524" height="52" rx="6" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><text x="62" y="92" fill="#e8e9ea" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Verdict</text><text x="62" y="109" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The one-line read on the trade</text><circle cx="614" cy="96" r="9" fill="#0a0b0c" stroke="#459e6b" stroke-width="1"/><text x="614" y="99.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">1</text><line x1="588" y1="96" x2="605" y2="96" stroke="#2a2d2f" stroke-width="1" stroke-dasharray="2 3"/><rect x="46" y="132" width="524" height="52" rx="6" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><text x="62" y="154" fill="#e8e9ea" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Data coverage</text><text x="62" y="171" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">How much the AI actually had to work with</text><circle cx="614" cy="158" r="9" fill="#0a0b0c" stroke="#459e6b" stroke-width="1"/><text x="614" y="161.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">2</text><line x1="588" y1="158" x2="605" y2="158" stroke="#2a2d2f" stroke-width="1" stroke-dasharray="2 3"/><rect x="46" y="194" width="524" height="52" rx="6" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><text x="62" y="216" fill="#e8e9ea" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Timeline</text><text x="62" y="233" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">What happened, in order, with prices at each step</text><circle cx="614" cy="220" r="9" fill="#0a0b0c" stroke="#459e6b" stroke-width="1"/><text x="614" y="223.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">3</text><line x1="588" y1="220" x2="605" y2="220" stroke="#2a2d2f" stroke-width="1" stroke-dasharray="2 3"/><rect x="46" y="256" width="524" height="84" rx="6" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><text x="62" y="278" fill="#e8e9ea" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Attribution</text><text x="62" y="295" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Which factors carried how much of the outcome</text><text x="62" y="310" fill="#6b7073" font-size="8.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Entry timing</text><rect x="150" y="304" width="138" height="6" rx="3" fill="#9aa0a3" stroke="none" stroke-width="0"/><text x="62" y="321" fill="#6b7073" font-size="8.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Position size</text><rect x="150" y="315" width="90" height="6" rx="3" fill="#6b7073" stroke="none" stroke-width="0"/><text x="62" y="332" fill="#6b7073" font-size="8.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Exit</text><rect x="150" y="326" width="72" height="6" rx="3" fill="#3d4144" stroke="none" stroke-width="0"/><circle cx="614" cy="298" r="9" fill="#0a0b0c" stroke="#459e6b" stroke-width="1"/><text x="614" y="301.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">4</text><line x1="588" y1="298" x2="605" y2="298" stroke="#2a2d2f" stroke-width="1" stroke-dasharray="2 3"/><rect x="46" y="350" width="524" height="76" rx="6" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><text x="62" y="372" fill="#e8e9ea" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Scorecard</text><text x="62" y="389" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Entry quality, exit discipline, risk management</text><rect x="62" y="396" width="150" height="22" rx="5" fill="#0a0b0c" stroke="#2a2d2f" stroke-width="1"/><text x="72" y="411" fill="#6b7073" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Entry</text><rect x="114" y="403" width="60" height="8" rx="4" fill="#1e2022" stroke="none" stroke-width="0"/><rect x="114" y="403" width="43.199999999999996" height="8" rx="4" fill="#459e6b" stroke="none" stroke-width="0"/><rect x="232" y="396" width="150" height="22" rx="5" fill="#0a0b0c" stroke="#2a2d2f" stroke-width="1"/><text x="242" y="411" fill="#6b7073" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Exit</text><rect x="284" y="403" width="60" height="8" rx="4" fill="#1e2022" stroke="none" stroke-width="0"/><rect x="284" y="403" width="24" height="8" rx="4" fill="#9aa0a3" stroke="none" stroke-width="0"/><rect x="402" y="396" width="150" height="22" rx="5" fill="#0a0b0c" stroke="#2a2d2f" stroke-width="1"/><text x="412" y="411" fill="#6b7073" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Risk</text><rect x="454" y="403" width="60" height="8" rx="4" fill="#1e2022" stroke="none" stroke-width="0"/><rect x="454" y="403" width="34.8" height="8" rx="4" fill="#6b7073" stroke="none" stroke-width="0"/><circle cx="614" cy="388" r="9" fill="#0a0b0c" stroke="#459e6b" stroke-width="1"/><text x="614" y="391.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">5</text><line x1="588" y1="388" x2="605" y2="388" stroke="#2a2d2f" stroke-width="1" stroke-dasharray="2 3"/><rect x="46" y="436" width="524" height="52" rx="6" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><text x="62" y="458" fill="#e8e9ea" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Counterfactual</text><text x="62" y="475" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">What your own rules would have produced instead</text><circle cx="614" cy="462" r="9" fill="#0a0b0c" stroke="#459e6b" stroke-width="1"/><text x="614" y="465.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">6</text><line x1="588" y1="462" x2="605" y2="462" stroke="#2a2d2f" stroke-width="1" stroke-dasharray="2 3"/><rect x="46" y="498" width="524" height="52" rx="6" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><text x="62" y="520" fill="#459e6b" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Lesson</text><text x="62" y="537" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">One sentence you can act on next time</text><circle cx="614" cy="524" r="9" fill="#0a0b0c" stroke="#459e6b" stroke-width="1"/><text x="614" y="527.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">7</text><line x1="588" y1="524" x2="605" y2="524" stroke="#2a2d2f" stroke-width="1" stroke-dasharray="2 3"/><text x="636" y="98" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Start here. It is blunt on</text><text x="636" y="114" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">purpose.</text><text x="636" y="160" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Low coverage means treat the</text><text x="636" y="176" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">rest as a hypothesis.</text><text x="636" y="222" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Where the decision actually went</text><text x="636" y="238" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">sideways.</text><text x="636" y="300" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The biggest bar is what to fix</text><text x="636" y="316" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">first.</text><text x="636" y="390" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Three separate skills. They move</text><text x="636" y="406" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">independently.</text><text x="636" y="464" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The gap between your plan and</text><text x="636" y="480" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">what you did.</text><text x="636" y="534" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Turn this into a playbook rule.</text>
</svg>
