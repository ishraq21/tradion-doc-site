<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="usagemeters-t usagemeters-d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="usagemeters-t">The three metered counters</title><desc id="usagemeters-d">Three rows, one per metered item: chat messages, quant sessions, and agent runs. Each shows a progress bar with the amount redacted. A footer notes that counters reset on your billing date and do not roll over.</desc>
<defs>
  <marker id="usagemeters-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,1.5 L8,5 L0,8.5 z" fill="#3d4144"/>
  </marker>
</defs>
<rect width="900" height="330" rx="10" fill="#0a0b0c"/>
<text x="28" y="34" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">THREE THINGS ARE METERED. EVERYTHING ELSE IS UNLIMITED.</text><rect x="28" y="56" width="844" height="60" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="48" y="82" fill="#e8e9ea" font-size="13" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Chat messages</text><text x="48" y="100" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">One message to the AI Asset Manager</text><rect x="430" y="82" width="380" height="10" rx="5" fill="#1e2022" stroke="none" stroke-width="0"/><rect x="430" y="82" width="235.6" height="10" rx="5" fill="#459e6b" stroke="none" stroke-width="0"/><text x="430" y="108" fill="#6b7073" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">used this cycle</text><text x="810" y="108" fill="#6b7073" font-size="11" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="end">— / —</text><rect x="28" y="130" width="844" height="60" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="48" y="156" fill="#e8e9ea" font-size="13" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Quant sessions</text><text x="48" y="174" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">One research session in the quant terminal</text><rect x="430" y="156" width="380" height="10" rx="5" fill="#1e2022" stroke="none" stroke-width="0"/><rect x="430" y="156" width="114" height="10" rx="5" fill="#459e6b" stroke="none" stroke-width="0"/><text x="430" y="182" fill="#6b7073" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">used this cycle</text><text x="810" y="182" fill="#6b7073" font-size="11" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="end">— / —</text><rect x="28" y="204" width="844" height="60" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="48" y="230" fill="#e8e9ea" font-size="13" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Agent runs</text><text x="48" y="248" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">One AI agent step inside an automation</text><rect x="430" y="230" width="380" height="10" rx="5" fill="#1e2022" stroke="none" stroke-width="0"/><rect x="430" y="230" width="319.2" height="10" rx="5" fill="#6b7073" stroke="none" stroke-width="0"/><text x="430" y="256" fill="#6b7073" font-size="9.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">used this cycle</text><text x="810" y="256" fill="#6b7073" font-size="11" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="end">— / —</text><rect x="28" y="280" width="844" height="30" rx="6" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><text x="48" y="300" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Resets on your billing date, not the 1st. Unused credits do not roll over.</text>
</svg>
