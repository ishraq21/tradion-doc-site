<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="crossesvsis-t crossesvsis-d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="crossesvsis-t">Crosses below compared with is below</title><desc id="crossesvsis-d">Two charts of the same indicator dipping under a threshold. The left, using crosses below, fires one alert at the moment it passes through. The right, using is below, fires an alert on every check while the value stays under the line.</desc>
<defs>
  <marker id="crossesvsis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,1.5 L8,5 L0,8.5 z" fill="#3d4144"/>
  </marker>
</defs>
<rect width="900" height="380" rx="10" fill="#0a0b0c"/>
<text x="28" y="32" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">THE SINGLE MOST COMMON AUTOMATION MISTAKE</text><rect x="28" y="52" width="420" height="240" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><line x1="52" y1="191.04" x2="424" y2="191.04" stroke="#6b7073" stroke-width="1" stroke-dasharray="4 4"/><text x="428" y="195.04" fill="#6b7073" font-size="9.5" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">30</text><path d="M52.0,136.3 L80.6,145.0 L109.2,160.8 L137.8,179.5 L166.5,196.8 L195.1,208.3 L223.7,214.1 L252.3,205.4 L280.9,211.2 L309.5,217.0 L338.2,202.6 L366.8,185.3 L395.4,168.0 L424.0,150.7" fill="none" stroke="#9aa0a3" stroke-width="1.6" stroke-linecap="round"/><circle cx="166.46153846153845" cy="196.8" r="5" fill="#459e6b" fill-opacity="0.22" stroke="#459e6b" stroke-width="1.2"/><line x1="166.46153846153845" y1="204.8" x2="166.46153846153845" y2="256" stroke="#459e6b" stroke-width="1" stroke-dasharray="2 3"/><path d="M163.46153846153845,260 L169.46153846153845,260 L166.46153846153845,266 z" fill="#459e6b"/><text x="52" y="82" fill="#459e6b" font-size="13" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">crosses below 30</text><text x="52" y="278" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Fires once, on the way through.</text><rect x="480" y="52" width="392" height="240" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><line x1="504" y1="191.04" x2="848" y2="191.04" stroke="#6b7073" stroke-width="1" stroke-dasharray="4 4"/><text x="852" y="195.04" fill="#6b7073" font-size="9.5" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">30</text><path d="M504.0,136.3 L530.5,145.0 L556.9,160.8 L583.4,179.5 L609.8,196.8 L636.3,208.3 L662.8,214.1 L689.2,205.4 L715.7,211.2 L742.2,217.0 L768.6,202.6 L795.1,185.3 L821.5,168.0 L848.0,150.7" fill="none" stroke="#9aa0a3" stroke-width="1.6" stroke-linecap="round"/><circle cx="609.8461538461538" cy="196.8" r="5" fill="#9aa0a3" fill-opacity="0.22" stroke="#9aa0a3" stroke-width="1.2"/><line x1="609.8461538461538" y1="204.8" x2="609.8461538461538" y2="256" stroke="#9aa0a3" stroke-width="1" stroke-dasharray="2 3"/><path d="M606.8461538461538,260 L612.8461538461538,260 L609.8461538461538,266 z" fill="#9aa0a3"/><circle cx="636.3076923076924" cy="208.32" r="5" fill="#9aa0a3" fill-opacity="0.22" stroke="#9aa0a3" stroke-width="1.2"/><line x1="636.3076923076924" y1="216.32" x2="636.3076923076924" y2="256" stroke="#9aa0a3" stroke-width="1" stroke-dasharray="2 3"/><path d="M633.3076923076924,260 L639.3076923076924,260 L636.3076923076924,266 z" fill="#9aa0a3"/><circle cx="662.7692307692307" cy="214.08" r="5" fill="#9aa0a3" fill-opacity="0.22" stroke="#9aa0a3" stroke-width="1.2"/><line x1="662.7692307692307" y1="222.08" x2="662.7692307692307" y2="256" stroke="#9aa0a3" stroke-width="1" stroke-dasharray="2 3"/><path d="M659.7692307692307,260 L665.7692307692307,260 L662.7692307692307,266 z" fill="#9aa0a3"/><circle cx="689.2307692307693" cy="205.44" r="5" fill="#9aa0a3" fill-opacity="0.22" stroke="#9aa0a3" stroke-width="1.2"/><line x1="689.2307692307693" y1="213.44" x2="689.2307692307693" y2="256" stroke="#9aa0a3" stroke-width="1" stroke-dasharray="2 3"/><path d="M686.2307692307693,260 L692.2307692307693,260 L689.2307692307693,266 z" fill="#9aa0a3"/><circle cx="715.6923076923077" cy="211.2" r="5" fill="#9aa0a3" fill-opacity="0.22" stroke="#9aa0a3" stroke-width="1.2"/><line x1="715.6923076923077" y1="219.2" x2="715.6923076923077" y2="256" stroke="#9aa0a3" stroke-width="1" stroke-dasharray="2 3"/><path d="M712.6923076923077,260 L718.6923076923077,260 L715.6923076923077,266 z" fill="#9aa0a3"/><circle cx="742.1538461538462" cy="216.96" r="5" fill="#9aa0a3" fill-opacity="0.22" stroke="#9aa0a3" stroke-width="1.2"/><line x1="742.1538461538462" y1="224.96" x2="742.1538461538462" y2="256" stroke="#9aa0a3" stroke-width="1" stroke-dasharray="2 3"/><path d="M739.1538461538462,260 L745.1538461538462,260 L742.1538461538462,266 z" fill="#9aa0a3"/><circle cx="768.6153846153846" cy="202.56" r="5" fill="#9aa0a3" fill-opacity="0.22" stroke="#9aa0a3" stroke-width="1.2"/><line x1="768.6153846153846" y1="210.56" x2="768.6153846153846" y2="256" stroke="#9aa0a3" stroke-width="1" stroke-dasharray="2 3"/><path d="M765.6153846153846,260 L771.6153846153846,260 L768.6153846153846,266 z" fill="#9aa0a3"/><text x="504" y="82" fill="#9aa0a3" font-size="13" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">is below 30</text><text x="504" y="278" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Fires on every check while it stays there.</text><rect x="28" y="308" width="844" height="50" rx="8" fill="#161719" stroke="rgba(69,158,107,0.30)" stroke-width="1" stroke-dasharray="4 3"/><text x="48" y="330" fill="#e8e9ea" font-size="11.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Conditions are checked about once a minute.</text><text x="48" y="348" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">"Is below" on a condition that stays true for an hour is roughly sixty alerts. Use "crosses" unless you want that.</text>
</svg>
