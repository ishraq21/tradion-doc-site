<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="t">How a confidence score breaks down</title><desc id="d">Five contributing factors — trend agreement, pattern quality, volume confirmation, risk and reward, and market context — each shown as a bar labelled weak, fair, or strong.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#63696c"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#459e6b"/>
  </marker>
</defs>
<rect width="900" height="340" rx="10" fill="#0b0c0d"/>
<text x="28" y="34" fill="#63696c" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">A CONFIDENCE SCORE IS A SUM OF PARTS — READ THE PARTS</text><text x="28" y="72" fill="#f2f2f2" font-size="12" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Trend agreement</text><text x="28" y="88" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Do the timeframes point the same way?</text><rect x="330" y="64" width="420" height="12" rx="6" fill="#1b1e20" stroke="none" stroke-width="0"/><rect x="330" y="64" width="361.2" height="12" rx="6" fill="#459e6b" stroke="none" stroke-width="0"/><text x="764" y="74" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">strong</text><text x="28" y="118" fill="#f2f2f2" font-size="12" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Pattern quality</text><text x="28" y="134" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">How cleanly does the setup match a known shape?</text><rect x="330" y="110" width="420" height="12" rx="6" fill="#1b1e20" stroke="none" stroke-width="0"/><rect x="330" y="110" width="294" height="12" rx="6" fill="#459e6b" stroke="none" stroke-width="0"/><text x="764" y="120" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">fair</text><text x="28" y="164" fill="#f2f2f2" font-size="12" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Volume confirmation</text><text x="28" y="180" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Is participation backing the move?</text><rect x="330" y="156" width="420" height="12" rx="6" fill="#1b1e20" stroke="none" stroke-width="0"/><rect x="330" y="156" width="231.00000000000003" height="12" rx="6" fill="#459e6b" stroke="none" stroke-width="0"/><text x="764" y="166" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">fair</text><text x="28" y="210" fill="#f2f2f2" font-size="12" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Risk / reward</text><text x="28" y="226" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Is the target far enough from the stop?</text><rect x="330" y="202" width="420" height="12" rx="6" fill="#1b1e20" stroke="none" stroke-width="0"/><rect x="330" y="202" width="168" height="12" rx="6" fill="#d99a2b" stroke="none" stroke-width="0"/><text x="764" y="212" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">weak</text><text x="28" y="256" fill="#f2f2f2" font-size="12" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Market context</text><text x="28" y="272" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Does the wider tape support it?</text><rect x="330" y="248" width="420" height="12" rx="6" fill="#1b1e20" stroke="none" stroke-width="0"/><rect x="330" y="248" width="260.4" height="12" rx="6" fill="#459e6b" stroke="none" stroke-width="0"/><text x="764" y="258" fill="#63696c" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">fair</text><rect x="28" y="290" width="844" height="34" rx="6" fill="#16191b" stroke="rgba(69,158,107,0.45)" stroke-width="1" stroke-dasharray="4 3"/><text x="48" y="312" fill="#9aa0a3" font-size="11.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">One weak factor inside a high overall score is the most useful thing on the card.</text>
</svg>
