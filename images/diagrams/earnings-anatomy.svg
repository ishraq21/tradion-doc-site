<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-labelledby="earningsanatomy-t earningsanatomy-d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="earningsanatomy-t">What Tradion extracts from an earnings report</title><desc id="earningsanatomy-d">An uploaded report on the left feeds six output panels: direction and conviction, beat or miss, guidance, management tone, the bull and bear case, and the options implied move.</desc>
<defs>
  <marker id="earningsanatomy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,1.5 L8,5 L0,8.5 z" fill="#3d4144"/>
  </marker>
</defs>
<rect width="940" height="440" rx="10" fill="#0a0b0c"/>
<text x="28" y="32" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">WHAT TRADION PULLS OUT OF AN EARNINGS REPORT</text><rect x="28" y="48" width="220" height="356" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1" stroke-dasharray="4 3"/><text x="48" y="72" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">WHAT YOU UPLOAD</text><rect x="48" y="88" width="180" height="240" rx="6" fill="#0a0b0c" stroke="#2a2d2f" stroke-width="1"/><rect x="64" y="108" width="135" height="6" rx="3" fill="#1e2022"/><rect x="64" y="126" width="105" height="6" rx="3" fill="#1e2022"/><rect x="64" y="144" width="127.5" height="6" rx="3" fill="#1e2022"/><rect x="64" y="162" width="75" height="6" rx="3" fill="#1e2022"/><rect x="64" y="180" width="120" height="6" rx="3" fill="#1e2022"/><rect x="64" y="198" width="97.5" height="6" rx="3" fill="#1e2022"/><rect x="64" y="216" width="135" height="6" rx="3" fill="#1e2022"/><rect x="64" y="234" width="60" height="6" rx="3" fill="#1e2022"/><rect x="64" y="252" width="112.5" height="6" rx="3" fill="#1e2022"/><rect x="64" y="270" width="90" height="6" rx="3" fill="#1e2022"/><rect x="64" y="288" width="132" height="6" rx="3" fill="#1e2022"/><rect x="64" y="306" width="82.5" height="6" rx="3" fill="#1e2022"/><text x="48" y="356" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">PDF or transcript</text><text x="48" y="374" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Or name a ticker and quarter</text><line x1="256" y1="226" x2="292" y2="226" stroke="#459e6b" stroke-width="1.2" marker-end="url(#earningsanatomy-arrow)"/><rect x="300" y="48" width="306" height="106" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="318" y="78" fill="#e8e9ea" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Direction &amp; conviction</text><text x="318" y="98" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Which way it reads, and how strongly</text><rect x="318" y="114" width="88" height="24" rx="5" fill="rgba(69,158,107,0.10)" stroke="rgba(69,158,107,0.30)" stroke-width="1"/><text x="362" y="131" fill="#459e6b" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">BULLISH</text><rect x="416" y="122" width="170" height="8" rx="4" fill="#1e2022" stroke="none" stroke-width="0"/><rect x="416" y="122" width="122" height="8" rx="4" fill="#459e6b" stroke="none" stroke-width="0"/><rect x="622" y="48" width="306" height="106" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="640" y="78" fill="#e8e9ea" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Beat or miss</text><text x="640" y="98" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Reported vs what analysts expected</text><rect x="640" y="120" width="227.79999999999998" height="6" rx="3" fill="#1e2022"/><rect x="640" y="134" width="160.79999999999998" height="6" rx="3" fill="#1e2022"/><rect x="300" y="170" width="306" height="106" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="318" y="200" fill="#e8e9ea" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Guidance</text><text x="318" y="220" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">What management says about next quarter</text><rect x="318" y="242" width="227.79999999999998" height="6" rx="3" fill="#1e2022"/><rect x="318" y="256" width="160.79999999999998" height="6" rx="3" fill="#1e2022"/><rect x="622" y="170" width="306" height="106" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="640" y="200" fill="#e8e9ea" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Management tone</text><text x="640" y="220" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Confidence and hedging in how they speak</text><rect x="640" y="242" width="227.79999999999998" height="6" rx="3" fill="#1e2022"/><rect x="640" y="256" width="160.79999999999998" height="6" rx="3" fill="#1e2022"/><rect x="300" y="292" width="306" height="106" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="318" y="322" fill="#e8e9ea" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Bull vs bear case</text><text x="318" y="342" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The strongest argument on each side</text><rect x="318" y="364" width="227.79999999999998" height="6" rx="3" fill="#1e2022"/><rect x="318" y="378" width="160.79999999999998" height="6" rx="3" fill="#1e2022"/><rect x="622" y="292" width="306" height="106" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="640" y="322" fill="#e8e9ea" font-size="12.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Options implied move</text><text x="640" y="342" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">How big a move the options market is pricing</text><rect x="640" y="364" width="227.79999999999998" height="6" rx="3" fill="#1e2022"/><rect x="640" y="378" width="160.79999999999998" height="6" rx="3" fill="#1e2022"/><text x="28" y="428" fill="#6b7073" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Guidance moves stocks more often than the quarter that was reported. Read it first.</text>
</svg>
