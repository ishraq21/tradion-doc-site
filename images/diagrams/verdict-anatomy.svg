<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="t">Anatomy of a verdict card</title><desc id="d">A verdict card with four numbered annotations: the directional call, the confidence score, the factor breakdown behind it, and the entry, stop, and target levels. All numeric values are redacted.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#63696c"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#459e6b"/>
  </marker>
</defs>
<rect width="900" height="420" rx="10" fill="#0b0c0d"/>
<rect x="28" y="40" width="470" height="340" rx="10" fill="#111315" stroke="#232729" stroke-width="1"/><rect x="52" y="66" width="76" height="30" rx="6" fill="rgba(69,158,107,0.14)" stroke="rgba(69,158,107,0.45)" stroke-width="1"/><text x="90" y="86" fill="#459e6b" font-size="14" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" text-anchor="middle">BUY</text><text x="146" y="86" fill="#63696c" font-size="11" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">TICKER · daily</text><text x="52" y="128" fill="#63696c" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">CONFIDENCE</text><rect x="52" y="138" width="300" height="8" rx="4" fill="#1b1e20" stroke="none" stroke-width="0"/><rect x="52" y="138" width="216" height="8" rx="4" fill="#459e6b" stroke="none" stroke-width="0"/><text x="366" y="146" fill="#9aa0a3" font-size="11" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="start">72 / 100</text><text x="52" y="178" fill="#63696c" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">WHY</text><rect x="52" y="190" width="368" height="6" rx="3" fill="#1b1e20" stroke="none" stroke-width="0"/><rect x="52" y="204" width="312" height="6" rx="3" fill="#1b1e20" stroke="none" stroke-width="0"/><rect x="52" y="218" width="240" height="6" rx="3" fill="#1b1e20" stroke="none" stroke-width="0"/><text x="52" y="244" fill="#63696c" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">LEVELS</text><rect x="52" y="262" width="400" height="22" rx="5" fill="#16191b" stroke="#232729" stroke-width="1"/><text x="64" y="277" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Entry</text><text x="440" y="277" fill="#63696c" font-size="11" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="end">— — —</text><rect x="52" y="292" width="400" height="22" rx="5" fill="#16191b" stroke="#232729" stroke-width="1"/><text x="64" y="307" fill="#c9524f" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Stop</text><text x="440" y="307" fill="#63696c" font-size="11" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="end">— — —</text><rect x="52" y="322" width="400" height="22" rx="5" fill="#16191b" stroke="#232729" stroke-width="1"/><text x="64" y="337" fill="#459e6b" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" text-anchor="start">Target</text><text x="440" y="337" fill="#63696c" font-size="11" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-weight="400" text-anchor="end">— — —</text><circle cx="534" cy="78" r="9" fill="rgba(69,158,107,0.14)" stroke="#459e6b" stroke-width="1"/><text x="534" y="81.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">1</text><text x="556" y="82" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The call itself. Four values: BUY, SELL, WAIT,</text><text x="556" y="98" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">NO TRADE.</text><circle cx="534" cy="156" r="9" fill="rgba(69,158,107,0.14)" stroke="#459e6b" stroke-width="1"/><text x="534" y="159.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">2</text><text x="556" y="160" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">How much the evidence agrees — not a</text><text x="556" y="176" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">probability of profit.</text><circle cx="534" cy="234" r="9" fill="rgba(69,158,107,0.14)" stroke="#459e6b" stroke-width="1"/><text x="534" y="237.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">3</text><text x="556" y="238" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The factors behind the score. Read these</text><text x="556" y="254" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">before the score.</text><circle cx="534" cy="312" r="9" fill="rgba(69,158,107,0.14)" stroke="#459e6b" stroke-width="1"/><text x="534" y="315.5" fill="#459e6b" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">4</text><text x="556" y="316" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Where to get in, where to get out, where to</text><text x="556" y="332" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">take profit.</text><line x1="508" y1="82" x2="525" y2="78" stroke="rgba(69,158,107,0.45)" stroke-width="1" stroke-dasharray="2 3"/><line x1="508" y1="142" x2="525" y2="156" stroke="rgba(69,158,107,0.45)" stroke-width="1" stroke-dasharray="2 3"/><line x1="508" y1="200" x2="525" y2="234" stroke="rgba(69,158,107,0.45)" stroke-width="1" stroke-dasharray="2 3"/><line x1="508" y1="290" x2="525" y2="312" stroke="rgba(69,158,107,0.45)" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
