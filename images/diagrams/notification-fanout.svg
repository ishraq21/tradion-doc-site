<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="notificationfanout-t notificationfanout-d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="notificationfanout-t">One trigger dispatching to five channels</title><desc id="notificationfanout-d">A trigger on the left fans out to five notification channels: Discord, email, Telegram, in-app, and an outbound webhook. A side panel describes the retry behaviour when a delivery fails.</desc>
<defs>
  <marker id="notificationfanout-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,1.5 L8,5 L0,8.5 z" fill="#3d4144"/>
  </marker>
</defs>
<rect width="900" height="360" rx="10" fill="#0a0b0c"/>
<text x="28" y="32" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">ONE TRIGGER, AS MANY CHANNELS AS YOU WANT</text><rect x="28" y="130" width="190" height="100" rx="8" fill="#101113" stroke="rgba(69,158,107,0.30)" stroke-width="1"/><text x="48" y="164" fill="#459e6b" font-size="13.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Trigger fires</text><text x="48" y="186" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Conditions all met</text><text x="48" y="204" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">and cooldown has passed</text><path d="M222,180 C290,180 300,74 356,74" fill="none" stroke="#3d4144" stroke-width="1" marker-end="url(#notificationfanout-arrow)"/><rect x="366" y="52" width="300" height="46" rx="7" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="386" y="72" fill="#e8e9ea" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Discord</text><text x="386" y="88" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">A webhook URL from your server</text><path d="M222,180 C290,180 300,134 356,134" fill="none" stroke="#3d4144" stroke-width="1" marker-end="url(#notificationfanout-arrow)"/><rect x="366" y="112" width="300" height="46" rx="7" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="386" y="132" fill="#e8e9ea" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Email</text><text x="386" y="148" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Your account address</text><path d="M222,180 C290,180 300,194 356,194" fill="none" stroke="#3d4144" stroke-width="1" marker-end="url(#notificationfanout-arrow)"/><rect x="366" y="172" width="300" height="46" rx="7" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="386" y="192" fill="#e8e9ea" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Telegram</text><text x="386" y="208" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Your chat with the bot</text><path d="M222,180 C290,180 300,254 356,254" fill="none" stroke="#3d4144" stroke-width="1" marker-end="url(#notificationfanout-arrow)"/><rect x="366" y="232" width="300" height="46" rx="7" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="386" y="252" fill="#e8e9ea" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">In-app</text><text x="386" y="268" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">A toast plus a saved entry</text><path d="M222,180 C290,180 300,314 356,314" fill="none" stroke="#3d4144" stroke-width="1" marker-end="url(#notificationfanout-arrow)"/><rect x="366" y="292" width="300" height="46" rx="7" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><text x="386" y="312" fill="#e8e9ea" font-size="12" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Webhook</text><text x="386" y="328" fill="#6b7073" font-size="10" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Signed POST to your own endpoint</text><rect x="690" y="52" width="182" height="262" rx="8" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><text x="706" y="74" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">IF DELIVERY FAILS</text><circle cx="710" cy="100" r="2.5" fill="#6b7073"/><text x="722" y="104" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Retried three times</text><circle cx="710" cy="134" r="2.5" fill="#6b7073"/><text x="722" y="138" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Backing off each time</text><circle cx="710" cy="168" r="2.5" fill="#6b7073"/><text x="722" y="172" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Then parked for review</text><circle cx="710" cy="202" r="2.5" fill="#6b7073"/><text x="722" y="206" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">The automation keeps</text><text x="722" y="220" fill="#9aa0a3" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">running</text><text x="28" y="344" fill="#6b7073" font-size="10.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">A revoked Discord webhook keeps failing until you replace the URL. Nothing turns itself off.</text>
</svg>
