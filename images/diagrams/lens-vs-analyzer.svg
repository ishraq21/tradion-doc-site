<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="lensvsanalyzer-t lensvsanalyzer-d" font-family="'Inter', system-ui, -apple-system, sans-serif">
<title id="lensvsanalyzer-t">Chart Analyzer compared with Lens</title><desc id="lensvsanalyzer-d">Two side-by-side columns. Chart Analyzer is for a chart image you upload. Lens works from the chart already open in Tradion. Both return a direction, a confidence score, and price levels.</desc>
<defs>
  <marker id="lensvsanalyzer-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,1.5 L8,5 L0,8.5 z" fill="#3d4144"/>
  </marker>
</defs>
<rect width="900" height="380" rx="10" fill="#0a0b0c"/>
<text x="28" y="32" fill="#6b7073" font-size="9" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="start" letter-spacing="0.8">SAME KIND OF ANSWER. THE DIFFERENCE IS WHERE THE CHART IS</text><rect x="28" y="52" width="416" height="240" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><rect x="28" y="52" width="416" height="4" rx="2" fill="#459e6b" stroke="none" stroke-width="0"/><text x="50" y="88" fill="#459e6b" font-size="15" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Chart Analyzer</text><text x="50" y="108" fill="#6b7073" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">You have an image file</text><rect x="50" y="126" width="372" height="26" rx="5" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><circle cx="66" cy="139" r="2.5" fill="#459e6b"/><text x="78" y="143" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">A screenshot you saved</text><rect x="50" y="158" width="372" height="26" rx="5" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><circle cx="66" cy="171" r="2.5" fill="#459e6b"/><text x="78" y="175" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">A chart someone sent you</text><rect x="50" y="190" width="372" height="26" rx="5" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><circle cx="66" cy="203" r="2.5" fill="#459e6b"/><text x="78" y="207" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Any platform, any source</text><rect x="50" y="222" width="372" height="26" rx="5" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><circle cx="66" cy="235" r="2.5" fill="#459e6b"/><text x="78" y="239" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">You upload it</text><rect x="456" y="52" width="416" height="240" rx="8" fill="#101113" stroke="#2a2d2f" stroke-width="1"/><rect x="456" y="52" width="416" height="4" rx="2" fill="#6b7073" stroke="none" stroke-width="0"/><text x="478" y="88" fill="#6b7073" font-size="15" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Lens</text><text x="478" y="108" fill="#6b7073" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">You are already in Tradion</text><rect x="478" y="126" width="372" height="26" rx="5" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><circle cx="494" cy="139" r="2.5" fill="#6b7073"/><text x="506" y="143" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Uses the chart on screen</text><rect x="478" y="158" width="372" height="26" rx="5" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><circle cx="494" cy="171" r="2.5" fill="#6b7073"/><text x="506" y="175" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Reads the ticker for you</text><rect x="478" y="190" width="372" height="26" rx="5" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><circle cx="494" cy="203" r="2.5" fill="#6b7073"/><text x="506" y="207" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">One click, no file handling</text><rect x="478" y="222" width="372" height="26" rx="5" fill="#161719" stroke="#2a2d2f" stroke-width="1"/><circle cx="494" cy="235" r="2.5" fill="#6b7073"/><text x="506" y="239" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Follow-up questions after</text><rect x="28" y="306" width="844" height="50" rx="8" fill="#161719" stroke="rgba(69,158,107,0.30)" stroke-width="1" stroke-dasharray="4 3"/><text x="48" y="328" fill="#e8e9ea" font-size="11.5" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="600" text-anchor="start">Both return a direction, a confidence score, and price levels.</text><text x="48" y="346" fill="#9aa0a3" font-size="11" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Neither one places a trade, and neither one is advice.</text>
</svg>
